<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chúc mừng 20/10 💐</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#fff;
    background:radial-gradient(ellipse at 50% 55%,var(--c1,#a63a86) 0%,var(--c2,#6b2170) 40%,var(--c3,#34103f) 80%,var(--c4,#1f0a2a) 100%);
    transition:--c1 2.4s,--c2 2.4s,--c3 2.4s,--c4 2.4s;
  }
  @property --c1{syntax:'<color>';inherits:true;initial-value:#a63a86}
  @property --c2{syntax:'<color>';inherits:true;initial-value:#6b2170}
  @property --c3{syntax:'<color>';inherits:true;initial-value:#34103f}
  @property --c4{syntax:'<color>';inherits:true;initial-value:#1f0a2a}
  body[data-theme="1"]{--c1:#7a4ac8;--c2:#4a2a8f;--c3:#241450;--c4:#120a2a}
  body[data-theme="2"]{--c1:#c8506a;--c2:#8a2f55;--c3:#451a3a;--c4:#22102a}
  body[data-theme="3"]{--c1:#d86a5a;--c2:#9a3a62;--c3:#40184a;--c4:#1f0a2a}

  /* tia sáng xoay + sao băng */
  .rays{position:fixed;left:50%;top:55%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;opacity:0;
      mix-blend-mode:screen;
      background:repeating-conic-gradient(rgba(255,200,230,0) 0deg,rgba(255,200,230,.25) 6deg,rgba(255,200,230,0) 12deg);
      -webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%)}
  .go .rays{animation:spin 90s linear infinite,appear2 4s 2s forwards}
  .star{position:fixed;left:var(--x);top:var(--y);width:130px;height:2px;pointer-events:none;opacity:0;
      background:linear-gradient(90deg,transparent,#fff);filter:drop-shadow(0 0 6px #fff)}
  .go .star{animation:shoot var(--p) var(--d) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes appear2{to{opacity:.5}}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(35deg)}2%{opacity:1}10%{opacity:0;transform:translate(300px,210px) rotate(35deg)}100%{opacity:0}}

  /* đường kẻ vàng dưới tiêu đề */
  .line{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
  .line::before,.line::after{content:'';height:1px;width:min(18vw,130px)}
  .line::before{background:linear-gradient(90deg,transparent,#ffe3a0);transform-origin:right}
  .line::after{background:linear-gradient(270deg,transparent,#ffe3a0);transform-origin:left}
  .line b{color:#ffe3a0;font-weight:400;font-size:14px;text-shadow:0 0 12px #ffd36e}
  .go .line::before,.go .line::after{animation:draw 1.5s 3s cubic-bezier(.2,.8,.2,1) both}
  .go .line b{animation:pop 1.2s 3.3s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes draw{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(0) rotate(-200deg)}to{opacity:1;transform:none}}
  @property --r{syntax:'<percentage>';inherits:false;initial-value:0%}

  /* nền aurora trôi nhẹ */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:0;mix-blend-mode:screen}
  .go .aurora i{animation:drift 14s ease-in-out infinite alternate,appear 3s 1.4s forwards}
  .aurora i:nth-child(2){animation-duration:19s,3s}
  .aurora i:nth-child(3){animation-duration:23s,3s}

  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
      align-items:center;justify-content:space-between;text-align:center;padding:4.5vh 20px 4vh}

  .kicker{letter-spacing:.35em;text-transform:uppercase;font-size:clamp(10px,1.6vw,14px);font-weight:400;color:#ffd9ea}
  .go .kicker{animation:kick 2.2s 1s cubic-bezier(.2,.8,.2,1) both}

  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(40px,8vw,88px);line-height:1.2;
      filter:drop-shadow(0 4px 18px rgba(255,90,160,.55))}
  h1 .w{display:inline-block;white-space:nowrap}
  h1 .l{display:inline-block}
  .go h1 .l{animation:letter 1.3s cubic-bezier(.2,.9,.25,1.15) calc(1.5s + var(--i)*.07s) both,
                       wave 3.4s ease-in-out calc(4.4s + var(--i)*.12s) infinite}

  footer{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:640px}
  .go footer>:not(.msg){animation:rise 1.2s cubic-bezier(.2,.8,.2,1) calc(3.2s + var(--d)*.28s) both}
  .to{--d:0;font-family:'Pacifico',cursive;font-size:clamp(18px,3vw,26px);color:#ffe3f0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .row{--d:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hint{--d:3;--o:.8;font-size:11px;letter-spacing:.06em;color:#f3c9de;opacity:.8}

  .msg{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;column-gap:.3em;min-height:3.4em;
      font-weight:300;font-size:clamp(13px,2vw,17px);line-height:1.7;color:#fff0f7;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .msg .wd{display:inline-block}
  .go .msg .wd{animation:wdIn .9s cubic-bezier(.2,.8,.2,1) calc(var(--b,0s) + var(--w)*.045s) both}
  .go .msg.out .wd{animation:wdOut .55s ease-in calc(var(--w)*.025s) both}

  button{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.55);color:#fff;
      background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:9px 22px;border-radius:999px;
      font:500 14px 'Be Vietnam Pro',system-ui,sans-serif;transition:.25s}
  button:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
  #err{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:30px;background:#34103f;z-index:9}

  /* chuyển cảnh mở màn: mống mắt (iris) + sóng ánh sáng */
  .curtain{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#2a0c36,#10041a);
      -webkit-mask:radial-gradient(circle at 50% 55%,transparent var(--r,0%),#000 calc(var(--r,0%) + 7%));
              mask:radial-gradient(circle at 50% 55%,transparent var(--r,0%),#000 calc(var(--r,0%) + 7%))}
  .go .curtain{animation:iris 2.8s .3s cubic-bezier(.65,0,.25,1) forwards}
  .ring{position:fixed;left:50%;top:55%;width:20vmin;height:20vmin;margin:-10vmin 0 0 -10vmin;border-radius:50%;z-index:6;
      pointer-events:none;opacity:0;border:2px solid rgba(255,205,230,.85);
      box-shadow:0 0 40px rgba(255,120,190,.6),inset 0 0 40px rgba(255,120,190,.4)}
  .go .ring{animation:ring 2.4s .3s cubic-bezier(.2,.7,.3,1) both}
  .go .ring.b{animation-delay:.65s;border-color:rgba(255,226,160,.8)}

  @keyframes iris{0%{--r:0%;opacity:1}85%{opacity:1}100%{--r:100%;opacity:0}}
  @keyframes ring{0%{transform:scale(0);opacity:.95}100%{transform:scale(10);opacity:0}}
  @keyframes appear{to{opacity:.5}}
  @keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.3)}}
  @keyframes kick{from{opacity:0;letter-spacing:1.5em;filter:blur(10px)}to{opacity:1;letter-spacing:.35em;filter:blur(0)}}
  @keyframes letter{
    from{opacity:0;transform:perspective(600px) translateY(60px) rotateX(-100deg) scale(.4);filter:blur(14px)}
    60%{opacity:1;filter:blur(0)}
    to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wave{0%,100%{text-shadow:0 0 8px rgba(255,120,180,.45)}50%{text-shadow:0 0 26px rgba(255,205,120,.95),0 0 5px #fff}}
  @keyframes rise{from{opacity:0;transform:translateY(34px) scale(.94);filter:blur(10px)}to{opacity:var(--o,1);transform:none;filter:blur(0)}}
  @keyframes wdIn{from{opacity:0;transform:translateY(20px) scale(.85);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wdOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateY(-16px) scale(1.1);filter:blur(8px)}}
</style>
</head>
<body>
<div class="rays"></div>
<i class="star" style="--x:8vw;--y:8vh;--d:5s;--p:11s"></i>
<i class="star" style="--x:58vw;--y:5vh;--d:9s;--p:14s"></i>
<i class="star" style="--x:25vw;--y:22vh;--d:14s;--p:17s"></i>
<div class="aurora">
  <i style="left:-12vmax;top:0;width:55vmax;height:55vmax;background:#ff4f9a;--dx:14vw;--dy:10vh"></i>
  <i style="right:-14vmax;bottom:-8vmax;width:48vmax;height:48vmax;background:#ffb25e;--dx:-12vw;--dy:-12vh"></i>
  <i style="left:35vw;top:-18vmax;width:42vmax;height:42vmax;background:#8a4dff;--dx:-10vw;--dy:14vh"></i>
</div>
<canvas id="c"></canvas>

<div class="ui">
  <header>
    <p class="kicker">Ngày Phụ nữ Việt Nam</p>
    <h1>Chúc mừng 20/10</h1>
    <div class="line"><b>✦</b></div>
  </header>
  <footer>
    <p class="to" id="to"></p>
    <p class="msg" id="msg"></p>
    <div class="row">
      <button id="heartBtn">💖 Thả tim</button>
      <button id="replayBtn">✨ Xem lại</button>
    </div>
    <p class="hint">Kéo để xoay · Cuộn / chụm tay để phóng to · Chạm để thả tim</p>
  </footer>
</div>

<div class="ring"></div><div class="ring b"></div>
<div class="curtain"></div>

<div id="err"><p>Không tải được đồ họa 3D.<br>Hãy kiểm tra kết nối mạng hoặc bật WebGL trên trình duyệt nhé 🌸</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  const showErr = () => { const e = document.getElementById('err'); e.style.display = 'grid'; };
  if (typeof THREE === 'undefined') { showErr(); return; }

  // ---- Lời đề tặng: thêm ?to=Tên vào đường dẫn để đổi người nhận ----
  const toName = (new URLSearchParams(location.search).get('to') || '').trim().slice(0, 40);
  document.getElementById('to').textContent = toName ? 'Gửi tặng ' + toName + ' 💖' : 'Gửi tặng bạn Lan Hương 💖';

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
  } catch (e) { showErr(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

  // ---- Ánh sáng ----
  scene.add(new THREE.HemisphereLight(0xfff1f7, 0x8a2b6c, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(4, 9, 7); scene.add(key);
  const rim = new THREE.PointLight(0xff7ab0, 1.4, 40); rim.position.set(-7, 3, -5); scene.add(rim);
  const fill = new THREE.PointLight(0xffe0a0, 0.9, 40); fill.position.set(6, -1, 6); scene.add(fill);
  const flash = new THREE.PointLight(0xffb0d0, 0, 30); flash.position.set(0, 2, 6); scene.add(flash);

  // ---- Tiện ích ----
  const C = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const R = rng(20102026);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOutCubic = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  // Tô màu đỉnh (vertex color) cho geometry
  function paint(g, col, fn) {
    const n = g.attributes.position.count, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const s = fn ? fn(i) : 1;
      arr[i * 3] = col.r * s; arr[i * 3 + 1] = col.g * s; arr[i * 3 + 2] = col.b * s;
    }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  }

  // Gộp nhiều geometry thành một (giảm draw call)
  function mergeGeos(geos) {
    let pc = 0, ic = 0;
    geos.forEach(g => { pc += g.attributes.position.count; ic += g.index.count; });
    const pos = new Float32Array(pc * 3), nor = new Float32Array(pc * 3), col = new Float32Array(pc * 3), idx = new Uint32Array(ic);
    let po = 0, io = 0;
    geos.forEach(g => {
      pos.set(g.attributes.position.array, po * 3);
      nor.set(g.attributes.normal.array, po * 3);
      col.set(g.attributes.color.array, po * 3);
      const ia = g.index.array;
      for (let i = 0; i < ia.length; i++) idx[io + i] = ia[i] + po;
      po += g.attributes.position.count; io += ia.length;
    });
    const m = new THREE.BufferGeometry();
    m.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    m.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    m.setAttribute('color', new THREE.BufferAttribute(col, 3));
    m.setIndex(new THREE.BufferAttribute(idx, 1));
    return m;
  }

  // ---- Cánh hoa hồng ----
  function petalGeo(W, H, wrap, bend, curl) {
    const g = new THREE.PlaneGeometry(1, 1, 8, 8);
    const p = g.attributes.position, sh = new Float32Array(p.count);
    for (let i = 0; i < p.count; i++) {
      const u = p.getX(i) * 2, v = p.getY(i) + 0.5;
      let prof = 0.4 + 0.6 * Math.sin(Math.min(1, v / 0.78) * Math.PI / 2);
      if (v > 0.78) { const k = (v - 0.78) / 0.22; prof *= Math.sqrt(Math.max(0, 1 - k * k * 0.88)); }
      const x = u * 0.5 * W * prof;
      let z = -u * u * wrap * W * 0.5 * prof + bend * v * v * H;
      if (v > 0.8) { const k = (v - 0.8) / 0.2; z += k * k * curl * H; }
      p.setXYZ(i, x, v * H, z);
      sh[i] = (0.6 + 0.4 * Math.pow(v, 0.9)) * (1 + 0.12 * Math.pow(Math.abs(u), 3) * v);
    }
    g.setAttribute('shade', new THREE.BufferAttribute(sh, 1));
    g.computeVertexNormals();
    return g;
  }

  const LAYERS = [
    { n: 3, r: 0.02, y: 0.00, H: 0.30, W: 0.30, tilt: -0.55, wrap: 1.2, bend: 0.05, curl: 0.00 },
    { n: 4, r: 0.05, y: -0.02, H: 0.36, W: 0.38, tilt: -0.32, wrap: 1.1, bend: 0.08, curl: 0.02 },
    { n: 5, r: 0.08, y: -0.04, H: 0.43, W: 0.46, tilt: -0.08, wrap: 1.0, bend: 0.12, curl: 0.05 },
    { n: 7, r: 0.12, y: -0.07, H: 0.48, W: 0.54, tilt: 0.18, wrap: 0.9, bend: 0.18, curl: 0.10 },
    { n: 9, r: 0.16, y: -0.10, H: 0.52, W: 0.60, tilt: 0.45, wrap: 0.8, bend: 0.24, curl: 0.18 },
    { n: 10, r: 0.20, y: -0.13, H: 0.54, W: 0.66, tilt: 0.75, wrap: 0.7, bend: 0.30, curl: 0.26 },
    { n: 12, r: 0.24, y: -0.16, H: 0.50, W: 0.70, tilt: 1.05, wrap: 0.6, bend: 0.30, curl: 0.42 }
  ].map(L => Object.assign({}, L, { geo: petalGeo(L.W, L.H, L.wrap, L.bend, L.curl) }));

  const SEPAL = petalGeo(0.16, 0.4, 0.5, 0.1, 0.0);
  const GREEN = C(0x3f8f4a);
  const dummy = new THREE.Object3D();
  dummy.rotation.order = 'YXZ';

  const roseMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.0 });

  function paintP(g, c, sh, li) {
    const n = g.attributes.position.count, arr = new Float32Array(n * 3), rim = c.clone().lerp(new THREE.Color(1, 0.8, 0.88), 0.45);
    for (let i = 0; i < n; i++) {
      const e = clamp((sh[i] - 0.85) * 2.6, 0, 1) * (0.35 + 0.08 * li), s = sh[i] * (0.85 + 0.15 * li / 6);
      arr[i * 3] = (c.r + (rim.r - c.r) * e) * s; arr[i * 3 + 1] = (c.g + (rim.g - c.g) * e) * s; arr[i * 3 + 2] = (c.b + (rim.b - c.b) * e) * s;
    }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  }
  function makeRose(hex) {
    const base = C(hex), parts = [];
    LAYERS.forEach((L, li) => {
      const off = R() * Math.PI * 2;
      for (let j = 0; j < L.n; j++) {
        const a = off + j / L.n * Math.PI * 2 + (R() - 0.5) * 0.25;
        const g = L.geo.clone();
        const c = base.clone().multiplyScalar(0.52 + 0.08 * li + R() * 0.05);
        const sh = g.attributes.shade.array;
        paintP(g, c, sh, li);
        const s = 0.92 + R() * 0.16;
        dummy.position.set(Math.sin(a) * L.r, L.y, Math.cos(a) * L.r);
        dummy.rotation.set(L.tilt + (R() - 0.5) * 0.12, a, (R() - 0.5) * 0.1);
        dummy.scale.set(s, s * (0.95 + R() * 0.1), s);
        dummy.updateMatrix();
        g.applyMatrix4(dummy.matrix);
        parts.push(g);
      }
    });
    // nhụy
    const core = new THREE.SphereGeometry(0.07, 10, 8); core.scale(1, 1.3, 1); core.translate(0, 0.1, 0);
    parts.push(paint(core, base.clone().multiplyScalar(0.4)));
    // đế hoa + đài hoa
    const rec = new THREE.SphereGeometry(0.15, 12, 8); rec.scale(1, 0.75, 1); rec.translate(0, -0.2, 0);
    parts.push(paint(rec, GREEN.clone().multiplyScalar(0.8)));
    for (let j = 0; j < 5; j++) {
      const a = j / 5 * Math.PI * 2 + R() * 0.3;
      const g = SEPAL.clone(); const sh = g.attributes.shade.array;
      paint(g, GREEN.clone().multiplyScalar(0.85), i => sh[i]);
      dummy.position.set(Math.sin(a) * 0.05, -0.18, Math.cos(a) * 0.05);
      dummy.rotation.set(1.9, a, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix(); g.applyMatrix4(dummy.matrix); parts.push(g);
    }
    return new THREE.Mesh(mergeGeos(parts), roseMat);
  }

  // ---- Lá ----
  function leafGeo(W, H, droop) {
    const g = new THREE.PlaneGeometry(1, 1, 6, 12);
    const p = g.attributes.position, sh = new Float32Array(p.count);
    for (let i = 0; i < p.count; i++) {
      const u = p.getX(i) * 2, v = p.getY(i) + 0.5;
      const prof = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, 0.8))), 0.9);
      const x = u * 0.5 * W * prof;
      const z = Math.abs(u) * 0.18 * W * prof - v * v * droop * H;
      p.setXYZ(i, x, v * H, z);
      sh[i] = 0.72 + 0.2 * v + 0.18 * Math.max(0, 1 - Math.abs(u) * 4);
    }
    g.setAttribute('shade', new THREE.BufferAttribute(sh, 1));
    g.computeVertexNormals();
    return g;
  }

  function tube(pts, r, col, seg, rad) {
    const curve = pts.length === 2 ? new THREE.LineCurve3(pts[0], pts[1]) : new THREE.CatmullRomCurve3(pts);
    return paint(new THREE.TubeGeometry(curve, seg || 16, r, rad || 6, false), col);
  }

  // ---- Bố cục bó hoa (hình vòm) ----
  const bouquet = new THREE.Group();
  scene.add(bouquet);
  const wrapG = new THREE.Group(), foliage = new THREE.Group();
  bouquet.add(wrapG, foliage);
  const DOME_C = new THREE.Vector3(0, -1.0, 0);
  const UP = new THREE.Vector3(0, 1, 0);
  function domeDir(phi, theta) {
    return new THREE.Vector3(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)).normalize();
  }
  function domePoint(phi, theta, rad) { return DOME_C.clone().addScaledVector(domeDir(phi, theta), rad); }
  const bottomPt = () => new THREE.Vector3((R() - 0.5) * 0.25, -2.75, (R() - 0.5) * 0.25);

  const stemGeos = [];
  const roses = [];

  function addRose(phi, theta, hex, scale, delay) {
    phi += (R() - 0.5) * 0.07; theta += (R() - 0.5) * 0.12; scale *= 0.94 + R() * 0.12;

      if (t - lastInteract > 1.5) rotY += dt * 0.28;
    }
    const ie = easeOutCubic(clamp(it / 3.4, 0, 1));
    bounce = Math.max(0, bounce - dt * 2.2);
    bouquet.rotation.y = rotY + (1 - ie) * -Math.PI * 2.2;
    bouquet.rotation.x = rotX;
    bouquet.scale.setScalar((0.55 + 0.45 * ie) * (1 + 0.04 * Math.sin(bounce * Math.PI)));
    bouquet.position.y = Math.sin(t * 1.3) * 0.07;

    // tim rơi
    for (let i = 0; i < FN; i++) {
      fPos[i * 3 + 1] -= fSpd[i] * dt;
      fPos[i * 3] += Math.sin(t * 0.8 + fPh[i]) * 0.004;
      if (fPos[i * 3 + 1] < -5) fPos[i * 3 + 1] = 8;
    }
    fGeo.attributes.position.needsUpdate = true;

    // thả tim
    for (let i = 0; i < BN; i++) {
      if (bLife[i] > 0) {
        bVel[i * 3 + 1] -= 4.5 * dt;
        bPos[i * 3] += bVel[i * 3] * dt; bPos[i * 3 + 1] += bVel[i * 3 + 1] * dt; bPos[i * 3 + 2] += bVel[i * 3 + 2] * dt;
        bLife[i] -= dt * 0.55;
      }
      const l = Math.max(0, bLife[i]);
      bCol[i * 3] = bBase[i * 3] * l; bCol[i * 3 + 1] = bBase[i * 3 + 1] * l; bCol[i * 3 + 2] = bBase[i * 3 + 2] * l;
    }
    bGeo.attributes.position.needsUpdate = true; bGeo.attributes.color.needsUpdate = true;

    const si = easeOutCubic(clamp(it / 4, 0, 1));
    sparks.rotation.y = t * 0.05 + (1 - si) * 6;
    sparks.scale.setScalar(0.25 + 0.75 * si);
    sparkMat.opacity = clamp(it / 1.2, 0, 1);

    // cánh hoa trong gió, đổi màu ánh sáng theo từng lời chúc
    gust = Math.max(0, gust - dt * 0.5);
    const pv = clamp((it - 2.5) / 2, 0, 1);
    for (let i = 0; i < PN; i++) {
      const d = pData[i];
      d.y -= d.v * dt * (1 + gust * 2); if (d.y < -4.5) d.y = 7;
      d.a += dt * d.w * (0.5 + gust * 2.5);
      const rr = d.r + Math.sin(t * 0.7 + d.ph) * 0.4;
      dummy.position.set(Math.cos(d.a) * rr, d.y, Math.sin(d.a) * rr);
      dummy.rotation.set(t * d.w * 2 + d.ph, t * d.w * 1.4, t * d.w * 1.7);
      dummy.scale.setScalar(d.s * pv);
      dummy.updateMatrix(); petalI.setMatrixAt(i, dummy.matrix);
    }
    petalI.instanceMatrix.needsUpdate = true;
    rim.color.lerp(themeRim[themeI], dt * 1.5); fill.color.lerp(themeFill[themeI], dt * 1.5);
    halo.material.color.lerp(themeRim[themeI], dt * 1.5);
    halo.material.opacity = clamp((it - 2) / 2, 0, 1) * (0.7 + 0.2 * Math.sin(t * 1.4) + gust * 0.3);
    sparkMat.size = 0.2 + 0.06 * Math.sin(t * 3);

    // máy quay: bay vòng từ trên cao xuống + dolly-zoom, sau đó lắc nhẹ theo con trỏ
    const inv = 1 - easeInOutCubic(clamp(it / 4.8, 0, 1));
    smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
    const fov = 40 + inv * 24;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
    const dist = baseDist * zoom * (1 + inv * 0.45), az = inv * 1.7 + smx * 0.22;
    camera.position.set(Math.sin(az) * dist, 2.4 + inv * 5.5 - smy * 0.7, Math.cos(az) * dist);
    camera.lookAt(0, -0.5, 0);
    halo.position.copy(camera.position).setLength(-4);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
<script>
(function () {
  var body = document.body, h1 = document.querySelector('h1'), msg = document.getElementById('msg');
  var title = h1.textContent.normalize('NFC');
  h1.setAttribute('aria-label', title); h1.textContent = '';
  var stops = [[255,255,255],[255,211,230],[255,233,168],[255,255,255]];
  function col(f) {
    var x = f * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), u = x - i;
    return stops[i].map(function (v, j) { return Math.round(v + (stops[i + 1][j] - v) * u); });
  }
  var total = title.replace(/ /g, '').length, n = 0;
  title.split(' ').forEach(function (w, wi) {
    var word = document.createElement('span'); word.className = 'w'; word.setAttribute('aria-hidden', 'true');
    Array.from(w).forEach(function (ch) {
      var s = document.createElement('span'); s.className = 'l'; s.textContent = ch;
      s.style.setProperty('--i', n); s.style.color = 'rgb(' + col(n / (total - 1)).join(',') + ')'; n++;
      word.appendChild(s);
    });
    if (wi) h1.appendChild(document.createTextNode(' '));
    h1.appendChild(word);
  });

  var wishes = [
    'Chúc bạn 20/10 thật vui vẻ, luôn xinh đẹp, rạng rỡ và gặp thật nhiều điều may mắn nhé.',
    //'Cảm ơn vì đã dịu dàng, mạnh mẽ và là điểm tựa của biết bao người.',
    'Mong mọi ước mơ của bạn sẽ sớm trở thành hiện thực.',
    'Chúc bạn có một ngày thật đặc biệt, nhận được nhiều lời chúc và luôn giữ nụ cười trên môi nhé! 🌸'
  ];
  var wi = 0, timer;
  function setMsg(i, base) {
    msg.classList.remove('out'); msg.textContent = ''; msg.style.setProperty('--b', base || '0s');
    wishes[i].split(' ').forEach(function (w, k) {
      var s = document.createElement('span'); s.className = 'wd'; s.style.setProperty('--w', k); s.textContent = w; msg.appendChild(s);
    });
  }
  function cycle(delay) {
    clearTimeout(timer);
    timer = setTimeout(function () {
      msg.classList.add('out');
      timer = setTimeout(function () { wi = (wi + 1) % wishes.length; setMsg(wi); theme(wi); cycle(7000); }, 1000);
    }, delay);
  }
  function theme(i) { body.dataset.theme = i; document.dispatchEvent(new CustomEvent('theme', { detail: i })); }
  function play() {
    body.classList.remove('go'); void body.offsetWidth; body.classList.add('go');
    wi = 0; setMsg(0, '3.9s'); theme(0); cycle(11000);
    document.dispatchEvent(new Event('replay'));
  }
  document.getElementById('replayBtn').addEventListener('click', play);
  play();
})();
</script>
</body>
