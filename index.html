<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chúc mừng 20/10 💐</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#fff;
    background:radial-gradient(ellipse at 50% 55%,var(--c1,#6d3bd8) 0%,var(--c2,#3b1f8f) 40%,var(--c3,#1a1052) 80%,var(--c4,#0a0620) 100%);
    transition:--c1 2.4s,--c2 2.4s,--c3 2.4s,--c4 2.4s;
  }
  @property --c1{syntax:'<color>';inherits:true;initial-value:#6d3bd8}
  @property --c2{syntax:'<color>';inherits:true;initial-value:#3b1f8f}
  @property --c3{syntax:'<color>';inherits:true;initial-value:#1a1052}
  @property --c4{syntax:'<color>';inherits:true;initial-value:#0a0620}
  body[data-theme="1"]{--c1:#d6457f;--c2:#8a2a6e;--c3:#3c1448;--c4:#170a28}
  body[data-theme="2"]{--c1:#1fa3b8;--c2:#1d5f93;--c3:#14315a;--c4:#08142c}
  body[data-theme="3"]{--c1:#e8924a;--c2:#a8456a;--c3:#43194f;--c4:#1a0a2a}

  canvas{display:block}
  .rays{position:fixed;left:50%;top:55%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;opacity:0;mix-blend-mode:screen;
      background:repeating-conic-gradient(rgba(190,210,255,0) 0deg,rgba(190,210,255,.22) 6deg,rgba(190,210,255,0) 12deg);
      -webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%)}
  .go .rays{animation:spin 90s linear infinite,appear2 4s 1s forwards}
  .star{position:fixed;left:var(--x);top:var(--y);width:130px;height:2px;pointer-events:none;opacity:0;
      background:linear-gradient(90deg,transparent,#fff);filter:drop-shadow(0 0 6px #fff)}
  .go .star{animation:shoot var(--p) var(--d) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes appear2{to{opacity:.5}}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(35deg)}2%{opacity:1}10%{opacity:0;transform:translate(300px,210px) rotate(35deg)}100%{opacity:0}}

  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.0;mix-blend-mode:screen;animation:drift 16s ease-in-out infinite alternate,appear 3s .2s forwards}
  .aurora i:nth-child(2){animation-duration:21s,3s}
  .aurora i:nth-child(3){animation-duration:25s,3s}
  @keyframes appear{to{opacity:.45}}
  @keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.3)}}

  #c3{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;cursor:grab}
  .ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;
      align-items:center;justify-content:space-between;text-align:center;
      padding:calc(4.5vh + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(4vh + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
  body:not(.go) .ui{visibility:hidden}
  .kicker{letter-spacing:.35em;text-transform:uppercase;font-size:clamp(10px,1.6vw,14px);color:#d9e4ff}
  .go .kicker{animation:kick 2.2s .2s cubic-bezier(.2,.8,.2,1) both}
  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(40px,8vw,88px);line-height:1.2;filter:drop-shadow(0 4px 20px rgba(140,110,255,.6))}
  h1 .w{display:inline-block;white-space:nowrap}
  h1 .l{display:inline-block}
  .go h1 .l{animation:letter 1.2s cubic-bezier(.2,.9,.25,1.15) calc(.5s + var(--i)*.07s) both,wave 3.4s ease-in-out calc(3s + var(--i)*.12s) infinite}
  .line{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
  .line::before,.line::after{content:'';height:1px;width:min(18vw,130px);opacity:0}
  .line::before{background:linear-gradient(90deg,transparent,#bfe3ff)}
  .line::after{background:linear-gradient(270deg,transparent,#bfe3ff)}
  .line b{color:#bfe3ff;font-weight:400;font-size:14px;text-shadow:0 0 12px #7fd0ff;opacity:0}
  .go .line::before,.go .line::after{animation:fadein 1.4s 1.6s both}
  .go .line b{animation:fadein 1.4s 1.8s both}
  footer{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:640px}
  .go footer>:not(.msg){animation:rise 1.1s cubic-bezier(.2,.8,.2,1) calc(2.2s + var(--d)*.25s) both}
  .to{--d:0;font-family:'Pacifico',cursive;font-size:clamp(18px,3vw,26px);color:#eef2ff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .row{--d:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hint{--d:3;--o:.8;font-size:11px;letter-spacing:.06em;color:#c9d6f5;opacity:.8}
  .msg{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;column-gap:.3em;min-height:3.4em;
      font-weight:300;font-size:clamp(13px,2vw,17px);line-height:1.7;color:#f4f6ff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .msg .wd{display:inline-block}
  .go .msg .wd{animation:wdIn .9s cubic-bezier(.2,.8,.2,1) calc(var(--b,0s) + var(--w)*.045s) both}
  .go .msg.out .wd{animation:wdOut .55s ease-in calc(var(--w)*.025s) both}

  button{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.5);color:#fff;
      background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:9px 22px;border-radius:999px;
      font:500 14px 'Be Vietnam Pro',system-ui,sans-serif;transition:.25s;touch-action:manipulation}
  button:active{background:rgba(255,255,255,.3)}
  @media (hover:hover){button:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}}

  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes kick{from{opacity:0;letter-spacing:1.5em;filter:blur(10px)}to{opacity:1;letter-spacing:.35em;filter:blur(0)}}
  @keyframes letter{from{opacity:0;transform:perspective(600px) translateY(60px) rotateX(-100deg) scale(.4);filter:blur(14px)}60%{opacity:1;filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wave{0%,100%{text-shadow:0 0 8px rgba(140,120,255,.5)}50%{text-shadow:0 0 26px rgba(120,220,255,.95),0 0 5px #fff}}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(10px)}to{opacity:var(--o,1);transform:none;filter:blur(0)}}
  @keyframes wdIn{from{opacity:0;transform:translateY(20px) scale(.85);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wdOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateY(-16px) scale(1.1);filter:blur(8px)}}

  /* ===== INTRO: QUẢ CẦU KÍNH + HẠT SÁNG GHÉP CHỮ ===== */
  #gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;
      padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));touch-action:manipulation}
  #gate.done{display:none}
  .g-bg{position:absolute;inset:0;overflow:hidden;transition:opacity 1.5s ease;
      background:radial-gradient(ellipse at 50% 45%,#1b1245 0%,#0d0828 55%,#05030f 100%)}
  #gate.reveal .g-bg{opacity:0}
  .g-bg::after{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(150,170,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(150,170,255,.07) 1px,transparent 1px);
      background-size:46px 46px;
      -webkit-mask:radial-gradient(circle at 50% 50%,#000,transparent 70%);mask:radial-gradient(circle at 50% 50%,#000,transparent 70%)}
  .g-bg i{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen;opacity:.5;animation:drift 14s ease-in-out infinite alternate}
  .g-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;transition:opacity .5s,transform .5s}
  #gate.go .g-stage{opacity:0;transform:scale(.9);pointer-events:none}
  .g-kicker{letter-spacing:.38em;text-transform:uppercase;font-size:clamp(10px,1.6vw,13px);color:#c9d6ff;opacity:0;animation:gfade 1.5s .2s both}
  .g-title{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(28px,6.4vw,48px);line-height:1.25;filter:drop-shadow(0 4px 20px rgba(140,110,255,.65));opacity:0;animation:gfade 1.5s .6s both}
  .g-sub{font-weight:300;font-size:clamp(12px,2vw,15px);color:#c9d6f5;opacity:0;animation:gfade 1.5s 1s both}
  @keyframes gfade{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

  #orb{position:relative;width:min(40vw,168px);aspect-ratio:1;border-radius:50%;padding:0;margin:6px 0;color:#fff;font-size:15px;letter-spacing:.12em;
      border:1px solid rgba(255,255,255,.45);
      background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.4),rgba(255,255,255,.06) 55%,rgba(120,100,255,.14) 100%);
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      box-shadow:0 0 70px rgba(130,100,255,.6),0 0 24px rgba(255,120,200,.35),inset 0 0 40px rgba(120,210,255,.28);
      opacity:0;animation:gfade 1.5s .2s both,float 3.4s 1.7s ease-in-out infinite;transition:transform .6s cubic-bezier(.6,-.3,.4,1.2),opacity .6s}
  #orb:hover{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),rgba(255,255,255,.1) 55%,rgba(120,100,255,.2) 100%)}
  #orb::before{content:'';position:absolute;inset:-5px;border-radius:50%;
      background:conic-gradient(#ff6ec7,#ffd36e,#6ee7ff,#b48aff,#ff6ec7);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
      animation:spin 5s linear infinite;filter:drop-shadow(0 0 8px rgba(160,140,255,.9))}
  #orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(160,200,255,.6);animation:oring 3s 1.8s ease-out infinite;pointer-events:none}
  #orb span{position:relative;display:block;text-shadow:0 0 14px rgba(180,200,255,.9)}
  #orb small{display:block;font-size:22px;margin-bottom:4px;animation:pulse 1.8s ease-in-out infinite}
  #orb.pressed{transform:scale(.1);opacity:0;animation:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes oring{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}

  #gSub2{position:fixed;left:0;right:0;top:60%;z-index:21;text-align:center;font-family:'Pacifico',cursive;font-size:clamp(18px,4vw,32px);color:#f4f0ff;
      text-shadow:0 0 22px rgba(140,120,255,.95),0 2px 10px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(14px);filter:blur(8px);transition:opacity 1s,transform 1s,filter 1s;padding:0 20px}
  #gSub2.show{opacity:1;transform:none;filter:blur(0)}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none}
  #flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,#fff 0%,#d8ccff 40%,#ff9ccb 75%,#6d3bd8 100%)}
  #flash.on{animation:flash 1.3s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  #err{display:none;position:fixed;inset:0;z-index:50;place-items:center;text-align:center;padding:30px;background:#1a1052}

  @supports (height:100dvh){#gate,.ui{height:100dvh}}
  @media (pointer:coarse),(max-width:700px){.aurora i,.g-bg i{filter:blur(40px)}.rays{display:none}}
  @media (max-width:380px){button{padding:8px 16px;font-size:13px}}
  @media (max-height:520px){
    #orb{width:84px}.g-stage{gap:6px}.g-sub{display:none}.g-title{font-size:24px}
    .ui{padding-top:calc(2vh + env(safe-area-inset-top,0px));padding-bottom:calc(2vh + env(safe-area-inset-bottom,0px))}
    h1{font-size:clamp(28px,7vh,44px)}.hint{display:none}
    .msg{min-height:2.6em;font-size:12px;line-height:1.5}.kicker{font-size:10px}footer{gap:6px}
  }
</style>
</head>
<body>
<div class="rays"></div>
<i class="star" style="--x:8vw;--y:8vh;--d:5s;--p:11s"></i>
<i class="star" style="--x:58vw;--y:5vh;--d:9s;--p:14s"></i>
<i class="star" style="--x:25vw;--y:22vh;--d:14s;--p:17s"></i>
<div class="aurora">
  <i style="left:-12vmax;top:0;width:55vmax;height:55vmax;background:#7c4dff;--dx:14vw;--dy:10vh"></i>
  <i style="right:-14vmax;bottom:-8vmax;width:48vmax;height:48vmax;background:#ff4fa0;--dx:-12vw;--dy:-12vh"></i>
  <i style="left:35vw;top:-18vmax;width:42vmax;height:42vmax;background:#22d3ee;--dx:-10vw;--dy:14vh"></i>
</div>
<canvas id="c3"></canvas>

<div class="ui">
  <header>
    <p class="kicker">Ngày Phụ nữ Việt Nam</p>
    <h1>Chúc mừng 20/10</h1>
    <div class="line"><b>✦</b></div>
  </header>
  <footer>
    <p class="to" id="to"></p>
    <p class="msg" id="msg"></p>
    <div class="row">
      <button id="flowerBtn">💐 Thả hoa</button>
      <button id="replayBtn">✨ Xem lại</button>
      <button id="musicBtn" aria-label="Bật/tắt nhạc">🔊 Nhạc</button>
    </div>
    <p class="hint">Kéo để xoay · Cuộn / chụm tay để phóng to · Chạm để thả hoa</p>
  </footer>
</div>

<div id="gate">
  <div class="g-bg">
    <i style="left:-10vmax;top:-6vmax;width:46vmax;height:46vmax;background:#6d3bd8;--dx:12vw;--dy:8vh"></i>
    <i style="right:-12vmax;bottom:-8vmax;width:42vmax;height:42vmax;background:#d6457f;--dx:-10vw;--dy:-10vh"></i>
  </div>
  <div class="g-stage">
    <h2 class="g-title" id="gTitle">Có một điều bất ngờ</h2>
    <button id="orb" aria-label="Bắt đầu"><span><small>✦</small>CHẠM</span></button>
    <p class="g-sub">Chạm vào quả cầu để bắt đầu nhé</p>
  </div>
</div>
<p id="gSub2">Chúc mừng ngày Phụ nữ Việt Nam</p>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="err"><p>Không tải được đồ họa 3D.<br>Hãy kiểm tra kết nối mạng hoặc bật WebGL trên trình duyệt nhé 💐</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  function showErr() { $('err').style.display = 'grid'; }
  if (typeof THREE === 'undefined') { showErr(); return; }
  if (document.fonts && document.fonts.load) { try { document.fonts.load('800 64px "Be Vietnam Pro"'); } catch (e) {} }

  var toName = (new URLSearchParams(location.search).get('to') || '').trim().slice(0, 40);
  $('to').textContent = toName ? 'Gửi tặng ' + toName + ' 💐' : 'Gửi tặng bạn Lan Hương 💐';
  if (toName) $('gTitle').textContent = 'Dành riêng cho ' + toName;

  var coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }

  /* ---------- âm thanh hiệu ứng (WebAudio) ---------- */
  var AC = null, muted = false;
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
  function riser(dur) {
    var a = ac(); if (!a || muted) return;
    var t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(220, t + dur);
    f.type = 'lowpass'; f.Q.value = 0.5;
    f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(1200, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + dur * 0.95); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.05);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.1);
  }
  function boom(vol) {
    var a = ac(); if (!a || muted) return;
    var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.6);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.85);
  }

  /* =====================================================
     HẠT SÁNG 2D: xoáy vào ghép chữ 20/10 rồi nổ tung
     ===================================================== */
  var fxC = $('fx'), fx = fxC.getContext('2d');
  var DPR2 = Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2), W = 1, H = 1;
  function sizeFx() { W = fxC.width = Math.round(window.innerWidth * DPR2); H = fxC.height = Math.round(window.innerHeight * DPR2); }
  sizeFx(); window.addEventListener('resize', sizeFx);

  var P = [], rings = [], introActive = false, introStart = 0, CX = 0, CY = 0;
  var easeOutCubic = function (x) { return 1 - Math.pow(1 - x, 3); };
  var easeInOutCubic = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var easeOutBack = function (x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  function buildText() {
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), size = Math.min(W * 0.8 / 2.9, H * 0.3);
    CX = W / 2; CY = H * 0.44;
    x.font = '800 ' + size + 'px "Be Vietnam Pro", system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    x.fillText('20/10', CX, CY);
    var y0 = Math.max(0, Math.floor(CY - size * 0.8)), hh = Math.min(H - y0, Math.ceil(size * 1.6));
    var img = x.getImageData(0, y0, W, hh).data, step = Math.max(2, Math.round(size / 34)), pts = [], px, py;
    for (py = 0; py < hh; py += step) for (px = 0; px < W; px += step) if (img[(py * W + px) * 4 + 3] > 128) pts.push([px + (Math.random() - 0.5) * step * 0.7, y0 + py + (Math.random() - 0.5) * step * 0.7]);
    for (var i = pts.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = pts[i]; pts[i] = pts[j]; pts[j] = t; }
    if (pts.length > 2600) pts.length = 2600;
    P.length = 0;
    pts.forEach(function (p) {
      var a = rnd(0, 6.283), r0 = Math.max(W, H) * rnd(0.5, 0.95), f = p[0] / W, hue = 330 - f * 140, gold = Math.random() < 0.1;
      P.push({ m: 0, sx: CX + Math.cos(a) * r0, sy: CY + Math.sin(a) * r0 * 0.8, tx: p[0], ty: p[1], dl: rnd(0.15, 1.3), du: rnd(1.5, 2.2), dir: Math.random() < 0.5 ? -1 : 1,
               col: 'hsl(' + (gold ? 45 : hue) + ',100%,' + (gold ? 72 : 68) + '%)', sz: rnd(1.1, 2.3) * DPR2, ph: rnd(0, 6.28), x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, drag: 0.96, gr: 0, heart: false });
    });
  }
  function explodeAll() {
    P.forEach(function (p) {
      if (p.m !== 0) return;
      var a = Math.atan2(p.y - CY, p.x - CX) + rnd(-0.5, 0.5), s = rnd(0.3, 1.3) * Math.max(W, H) * 0.85;

  var clock = new THREE.Clock();
